<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="820" viewBox="0 0 1280 820" role="img" aria-labelledby="title desc">
  <title id="title">SniffKitty ESP32-S3 wiring diagram</title>
  <desc id="desc">Signal connections from the ESP32-S3 to the gas sensors, AHT10, status LED, microSD module, and camera.</desc>
  <defs>
    <style>
      text { font-family: Arial, Helvetica, sans-serif; }
      .page-title { font-size: 30px; font-weight: 700; fill: #0f172a; }
      .subtitle { font-size: 15px; fill: #475569; }
      .card-title { font-size: 19px; font-weight: 700; fill: #0f172a; }
      .body { font-size: 14px; fill: #334155; }
      .pin { font-size: 14px; font-weight: 600; fill: #1e3a8a; }
      .warning { font-size: 13px; fill: #991b1b; }
      .card { fill: #ffffff; stroke: #94a3b8; stroke-width: 2; }
      .controller { fill: #eff6ff; stroke: #2563eb; stroke-width: 3; }
      .divider { stroke: #bfdbfe; stroke-width: 1.5; }
      .wire { fill: none; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
      .adc { stroke: #2563eb; }
      .i2c { stroke: #7c3aed; }
      .led-wire { stroke: #db2777; }
      .spi { stroke: #059669; }
      .camera-wire { stroke: #ea580c; }
    </style>
    <marker id="blue-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#2563eb"/></marker>
    <marker id="purple-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#7c3aed"/></marker>
    <marker id="pink-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#db2777"/></marker>
    <marker id="green-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#059669"/></marker>
    <marker id="orange-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#ea580c"/></marker>
  </defs>

  <rect width="1280" height="820" fill="#f8fafc"/>
  <text x="40" y="48" class="page-title">SniffKitty - ESP32-S3 Wiring Diagram</text>
  <text x="40" y="76" class="subtitle">Signal assignments from include/config.h. All modules share a common ground.</text>

  <!-- Left-side modules -->
  <rect x="45" y="130" width="300" height="122" rx="15" class="card"/>
  <text x="70" y="166" class="card-title">MQ137 ammonia sensor</text>
  <text x="70" y="201" class="body">Analog output</text>
  <text x="220" y="201" class="pin">GPIO 1</text>
  <text x="70" y="229" class="body">VCC and GND</text>

  <rect x="45" y="282" width="300" height="122" rx="15" class="card"/>
  <text x="70" y="318" class="card-title">MQ135 air-quality sensor</text>
  <text x="70" y="353" class="body">Analog output</text>
  <text x="220" y="353" class="pin">GPIO 2</text>
  <text x="70" y="381" class="body">VCC and GND</text>

  <rect x="45" y="434" width="300" height="140" rx="15" class="card"/>
  <text x="70" y="470" class="card-title">AHT10 temperature / humidity</text>
  <text x="70" y="505" class="body">SDA</text>
  <text x="220" y="505" class="pin">GPIO 14</text>
  <text x="70" y="533" class="body">SCL</text>
  <text x="220" y="533" class="pin">GPIO 21</text>
  <text x="70" y="558" class="body">3.3 V and GND</text>

  <rect x="45" y="604" width="300" height="112" rx="15" class="card"/>
  <text x="70" y="640" class="card-title">Addressable status LED</text>
  <text x="70" y="675" class="body">Data input</text>
  <text x="220" y="675" class="pin">GPIO 48</text>
  <text x="70" y="700" class="body">VCC and GND</text>

  <!-- Controller -->
  <rect x="465" y="130" width="350" height="586" rx="22" class="controller"/>
  <text x="640" y="172" text-anchor="middle" class="card-title">ESP32-S3 DevKitC-1</text>

  <text x="495" y="215" class="card-title">Sensor inputs</text>
  <text x="495" y="247" class="body">MQ137 ADC</text><text x="700" y="247" class="pin">GPIO 1</text>
  <text x="495" y="275" class="body">MQ135 ADC</text><text x="700" y="275" class="pin">GPIO 2</text>
  <text x="495" y="303" class="body">AHT10 SDA / SCL</text><text x="670" y="303" class="pin">GPIO 14 / 21</text>
  <text x="495" y="331" class="body">Status LED</text><text x="700" y="331" class="pin">GPIO 48</text>

  <line x1="495" y1="360" x2="785" y2="360" class="divider"/>
  <text x="495" y="397" class="card-title">MicroSD SPI</text>
  <text x="495" y="429" class="body">SCK / MISO</text><text x="670" y="429" class="pin">GPIO 42 / 41</text>
  <text x="495" y="457" class="body">MOSI / CS</text><text x="670" y="457" class="pin">GPIO 47 / 45</text>

  <line x1="495" y1="486" x2="785" y2="486" class="divider"/>
  <text x="495" y="523" class="card-title">Camera interface</text>
  <text x="495" y="555" class="body">Clock</text><text x="670" y="555" class="pin">XCLK 15, PCLK 13</text>
  <text x="495" y="583" class="body">Control</text><text x="670" y="583" class="pin">SIOD 4, SIOC 5</text>
  <text x="495" y="611" class="body">Sync</text><text x="670" y="611" class="pin">VSYNC 6, HREF 7</text>
  <text x="495" y="639" class="body">Data Y2-Y9</text><text x="620" y="639" class="pin">11, 9, 8, 10, 12, 18, 17, 16</text>

  <line x1="495" y1="667" x2="785" y2="667" class="divider"/>
  <text x="495" y="697" class="warning">ESP32 GPIO and ADC inputs are not 5 V tolerant.</text>

  <!-- Right-side modules -->
  <rect x="935" y="160" width="300" height="190" rx="15" class="card"/>
  <text x="960" y="196" class="card-title">MicroSD module</text>
  <text x="960" y="231" class="body">SCK</text><text x="1120" y="231" class="pin">GPIO 42</text>
  <text x="960" y="259" class="body">MISO</text><text x="1120" y="259" class="pin">GPIO 41</text>
  <text x="960" y="287" class="body">MOSI</text><text x="1120" y="287" class="pin">GPIO 47</text>
  <text x="960" y="315" class="body">CS</text><text x="1120" y="315" class="pin">GPIO 45</text>
  <text x="960" y="338" class="body">3.3 V and GND</text>

  <rect x="935" y="410" width="300" height="220" rx="15" class="card"/>
  <text x="960" y="446" class="card-title">Camera module</text>
  <text x="960" y="481" class="body">Clock</text><text x="1080" y="481" class="pin">XCLK, PCLK</text>
  <text x="960" y="509" class="body">Control</text><text x="1080" y="509" class="pin">SIOD, SIOC</text>
  <text x="960" y="537" class="body">Sync</text><text x="1080" y="537" class="pin">VSYNC, HREF</text>
  <text x="960" y="565" class="body">Data bus</text><text x="1080" y="565" class="pin">Y2-Y9</text>
  <text x="960" y="601" class="body">Power and common ground</text>

  <!-- Smooth signal paths without inline labels -->
  <path d="M345 191 C395 191, 420 191, 465 230" class="wire adc" marker-end="url(#blue-arrow)"/>
  <path d="M345 343 C395 343, 420 343, 465 273" class="wire adc" marker-end="url(#blue-arrow)"/>
  <path d="M345 504 C398 504, 420 504, 465 305" class="wire i2c" marker-end="url(#purple-arrow)"/>
  <path d="M345 660 C400 660, 425 660, 465 332" class="wire led-wire" marker-end="url(#pink-arrow)"/>
  <path d="M815 430 C865 430, 880 255, 935 255" class="wire spi" marker-end="url(#green-arrow)"/>
  <path d="M815 565 C865 565, 885 520, 935 520" class="wire camera-wire" marker-end="url(#orange-arrow)"/>

  <!-- Safety note -->
  <rect x="40" y="750" width="1195" height="48" rx="12" fill="#fff7ed" stroke="#fdba74"/>
  <text x="65" y="779" class="warning">MQ sensor heaters may use 5 V, but each analog output must be limited to the ESP32 ADC range of 0-3.3 V.</text>
</svg>
